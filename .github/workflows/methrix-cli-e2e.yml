name: methrix-cli-e2e

on:
  push:
    branches: [main]
    paths:
      - "**"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/methrix-cli-e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libhdf5-dev curl zlib1g-dev r-base-core r-bioc-rhdf5

      - name: Configure HDF5 environment
        run: |
          set -euo pipefail
          echo "HDF5_INCLUDE_DIR=/usr/include/hdf5/serial" >> "$GITHUB_ENV"
          echo "HDF5_LIB_DIR=/usr/lib/x86_64-linux-gnu/hdf5/serial" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/hdf5/serial/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          test -f /usr/include/hdf5/serial/hdf5.h
          test -f /usr/lib/x86_64-linux-gnu/hdf5/serial/libhdf5.so
          pkg-config --modversion hdf5 || pkg-config --modversion hdf5-serial

      - name: Download hg19 FASTA from UCSC
        run: |
          set -euo pipefail
          mkdir -p testdata/hg19_genome
          curl -L --retry 5 --retry-delay 5 \
            -o testdata/hg19_genome/hg19.fa.gz \
            https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/hg19.fa.gz
          gzip -t testdata/hg19_genome/hg19.fa.gz
          ls -lh testdata/hg19_genome/hg19.fa.gz

      - name: Download hg19 GTF for annotation test
        run: |
          set -euo pipefail
          mkdir -p testdata/annotations
          curl -fL --retry 5 --retry-delay 5 \
            -o testdata/annotations/hg19.gtf.gz \
            https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/genes/hg19.refGene.gtf.gz
          gzip -t testdata/annotations/hg19.gtf.gz
          ls -lh testdata/annotations/hg19.gtf.gz

      - name: Build methrix-cli
        run: |
          set -euo pipefail
          cargo build --release
          ./target/release/methrix --help | head -n 20

      - name: E2E test with GTF annotation
        run: |
          set -euo pipefail
          ./target/release/methrix process \
            --input testdata \
            --output testdata/output_e2e \
            --genome testdata/hg19_genome/hg19.fa.gz \
            --annotation-dir testdata/annotations \
            --threads 4 \
            --min-coverage 1 \
            --remove-uncovered

          test -s testdata/output_e2e/assays.h5
          test -s testdata/output_e2e/methrix_data.h5
          test -s testdata/output_e2e/CpG_coverage.xlsx
          test -s testdata/output_e2e/CpG_annotation_report.xlsx

          # Verify annotation report sheets (GTF-only mode)
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          report = Path("testdata/output_e2e/CpG_annotation_report.xlsx")
          assert report.exists() and report.stat().st_size > 0, "annotation report missing"
          with zipfile.ZipFile(report) as zf:
            workbook_xml = zf.read("xl/workbook.xml").decode("utf-8")
          assert "ChIPseeker_By_Sample" in workbook_xml, "missing ChIPseeker_By_Sample sheet"
          assert "CpG_Details" in workbook_xml, "missing CpG_Details sheet"
          assert "ChIPseeker_Summary" not in workbook_xml, "legacy ChIPseeker_Summary should not exist"
          assert "CpG_Context" not in workbook_xml, "legacy CpG_Context sheet should not exist"
          PY

          ls -lh testdata/output_e2e

      - name: R HDF5 compatibility check
        run: |
          set -euo pipefail
          Rscript tests/integration/test_r_compatibility.R testdata/output_e2e/assays.h5

      - name: QC report compatibility check
        run: |
          set -euo pipefail
          ./target/release/methrix qc-report \
            --input testdata/output_e2e \
            --output testdata/output_e2e/CpG_coverage_recomputed_from_h5.xlsx
          test -s testdata/output_e2e/CpG_coverage_recomputed_from_h5.xlsx

      - name: Upload QC Excel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: methrix-qc-excel-${{ github.run_id }}
          path: |
            testdata/output_e2e/CpG_coverage.xlsx
            testdata/output_e2e/CpG_coverage_recomputed_from_h5.xlsx
            testdata/output_e2e/CpG_annotation_report.xlsx
          if-no-files-found: error
          retention-days: 14
